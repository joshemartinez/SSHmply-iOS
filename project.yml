name: SSHmply
options:
  bundleIdPrefix: com.sshmply
  createIntermediateGroups: true
  developmentLanguage: es
  deploymentTarget:
    iOS: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES

packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    exactVersion: 0.11.1
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.18.0
  swift-nio-ssh:
    url: https://github.com/Joannis/swift-nio-ssh.git
    minorVersion: 0.3.4
  swift-nio:
    url: https://github.com/apple/swift-nio.git
    from: 2.81.0
  swift-crypto:
    url: https://github.com/apple/swift-crypto.git
    from: 3.12.3

targets:
  SSHmply:
    type: application
    platform: iOS
    sources:
      - path: SSHmply
        excludes:
          - Info.plist
          - Resources/i18n
      - path: SSHmply/Resources/i18n
        type: folder
    dependencies:
      - package: Citadel
        product: Citadel
      - package: SwiftTerm
        product: SwiftTerm
      - package: swift-nio-ssh
        product: NIOSSH
      - package: swift-nio
        product: NIOCore
      - package: swift-crypto
        product: Crypto
    info:
      path: SSHmply/Info.plist
      properties:
        CFBundleDisplayName: SSHmply
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: SSHmply connects to servers in your local network over SSH and SFTP.
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sshmply.app
        PRODUCT_NAME: SSHmply
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: SSHmply/Info.plist
        CODE_SIGN_STYLE: Automatic
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"

  SSHmplyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SSHmplyTests
    dependencies:
      - target: SSHmply
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sshmply.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SSHmply.app/SSHmply"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  SSHmply:
    build:
      targets:
        SSHmply: all
        SSHmplyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SSHmplyTests
    archive:
      config: Release
